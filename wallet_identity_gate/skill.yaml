  rationale: The AgentsEstates sign-in retry failed identically overnight every 30 minutes with an EIP712 signer address mismatch because the executor was bound to rayden.ai while the job targeted zorin.ai, producing no order, mint, transaction or gas, and the 2026-11-02 follow-up at assistant-msg-a8e0a66d stated continuing the retry as-is cannot succeed and the choice is switch wallets and re-pair or pause the retry; the failed sign-in retry run bc3b311d-36b7-4e68-a382-f9b4073e5888 is in the evidence window. The same wallet-confusion shape appeared in the Chip404 transfer, where the wrong wallets were checked first and reported as holding nothing before assistant-msg-74aa2c93 corrected the holding wallet. Skill search found no existing wallet-identity skill, and the existing time_boxed_onchain_tasks skill covers session validity and polling but not a character-by-character live-versus-target address match or a stop rule for a structurally blocked retry, so this new skill fills that gap without duplicating it.
