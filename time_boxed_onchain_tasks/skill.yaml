  rationale: 'The evidence shows the same idle and state-loss shape across separate tasks, not a single project bug. A relay round auto-ended after the last touch at 22:51 WIB while work continued elsewhere (assistant-msg-8219e750), a long puzzle task ran with background agents idle for long stretches and lost helper installs and temporary files on reset before a timed solver attempt failed (assistant-msg-b328b04e), and the failure ledger shows repeated interrupted subagents including the same aborted message across four work ids. Skill searches found no existing skill for background polling, heartbeat, workspace persistence or timed-challenge estimation, and the inventories show zero managed custom skills, so there is no consolidation or re-proposal conflict. Cron runs were all successful, so this is not a scheduled-job failure. This one skill codifies only the uncodified parts: record limits first, poll at the stated interval, keep state out of temporary storage, and estimate total time before taking a timed challenge.'
